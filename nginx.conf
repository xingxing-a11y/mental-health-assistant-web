# 由后端仓库的 docker-compose.yml 挂载到容器内 /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 multipart 限 2MB（application.yml），这里留一倍余量
    client_max_body_size 4m;

    # 前端用相对路径 /api/v1/... 请求，靠这里转到后端容器，保证同域 + Cookie 生效
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI 对话是 SSE 流式输出，必须关缓冲，否则前端收不到逐字返回
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：找不到的路径统一回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
